version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: incidex-db
    restart: always
    environment:
      POSTGRES_DB: incidex_db
      POSTGRES_USER: incidex_user
      POSTGRES_PASSWORD: incidex_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
